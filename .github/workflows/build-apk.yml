name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify files were not modified
        run: |
          sha256sum -c CHECKSUMS.sha256 --quiet || { echo "ERROR: project files were changed after they were prepared. Upload the original files unchanged."; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android-wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android-wrapper
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EPI-CALCULATOR
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
